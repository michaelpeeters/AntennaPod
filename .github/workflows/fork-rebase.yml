name: Fork Rebase & Release

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
  push:
    branches: [ mine ]

permissions:
  contents: write
  issues: write

jobs:
  rebase:
    name: "Rebase mine onto upstream master"
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          ref: mine
          fetch-depth: 0
      - name: Fetch upstream master
        run: |
          git remote add upstream https://github.com/AntennaPod/AntennaPod.git
          git fetch upstream master
      - name: Check whether upstream has new commits
        id: check
        run: |
          if [ "$(git rev-parse upstream/master)" = "$(git merge-base mine upstream/master)" ]; then
            echo "up_to_date=true" >> "$GITHUB_OUTPUT"
          else
            echo "up_to_date=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Rebase onto upstream/master
        if: steps.check.outputs.up_to_date == 'false' && github.event_name != 'push'
        run: git rebase upstream/master
      - name: Set up JDK 21
        if: steps.check.outputs.up_to_date == 'false' || github.event_name == 'push'
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Cache Gradle
        if: steps.check.outputs.up_to_date == 'false' || github.event_name == 'push'
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle*') }}-${{ hashFiles('**/gradle/wrapper/gradle-wrapper.properties') }}
      - name: Configure parallel build
        if: steps.check.outputs.up_to_date == 'false' || github.event_name == 'push'
        run: echo "org.gradle.parallel=true" >> local.properties
      - name: Create temporary release keystore
        if: steps.check.outputs.up_to_date == 'false' || github.event_name == 'push'
        run: |
          keytool -noprompt -genkey -v -keystore "app/keystore" -alias alias -storepass password -keypass password -keyalg RSA -validity 10 -dname "CN=antennapod.org, OU=dummy, O=dummy, L=dummy, S=dummy, C=US"
          cp app/keystore app-wearos/keystore
      - name: Unit tests
        if: steps.check.outputs.up_to_date == 'false' || github.event_name == 'push'
        run: ./gradlew testPlayDebugUnitTest testDebugUnitTest
      - name: Push rebased mine
        if: steps.check.outputs.up_to_date == 'false' && github.event_name != 'push'
        run: git push --force-with-lease origin mine
      - name: Bump versionCode for this build
        if: steps.check.outputs.up_to_date == 'false' || github.event_name == 'push'
        run: |
          # versionCode is static in app/build.gradle, so Obtainium (which
          # compares versionCode) never sees fork-latest as a new version.
          # Give this build a unique, monotonically increasing one.
          sed -i "s/versionCode 3120195/versionCode $((3120195 + GITHUB_RUN_NUMBER))/" app/build.gradle
        env:
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
      - name: Restore debug keystore
        if: steps.check.outputs.up_to_date == 'false' || github.event_name == 'push'
        run: |
          mkdir -p ~/.android ~/.config/.android
          echo "${{ secrets.FORK_DEBUG_KEYSTORE_B64 }}" | base64 -d > ~/.android/debug.keystore
          cp ~/.android/debug.keystore ~/.config/.android/debug.keystore
      - name: Build debug APK
        if: steps.check.outputs.up_to_date == 'false' || github.event_name == 'push'
        run: ./gradlew assemblePlayDebug
      - name: Publish fork release
        if: steps.check.outputs.up_to_date == 'false' || github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
        run: |
          # Obtainium derives its tracked "pseudo-version" from the release's
          # own GitHub metadata (tag/id/date), not from the APK's versionCode.
          # Editing one release in place forever freezes that metadata, so
          # Obtainium can never see a new build. Give every build its own
          # tag/release (new id + date) so Obtainium detects it, but only
          # prune the old one(s) *after* the new release exists, so there's
          # never a window with no release at all (the failure mode that
          # in-place editing was originally introduced to avoid).
          TAG="fork-$GITHUB_RUN_NUMBER"
          SHA=$(git rev-parse --short HEAD)
          TITLE="Fork build $(date -u +%Y-%m-%d) ($SHA)"
          NOTES="Automated build from mine @ $SHA. Signed with the fork's persistent debug key for in-place updates via Obtainium."
          gh release create "$TAG" app/build/outputs/apk/play/debug/app-play-debug.apk \
            --repo "${{ github.repository }}" --title "$TITLE" --notes "$NOTES"
          gh release list --repo "${{ github.repository }}" --json tagName -q '.[].tagName' \
            | grep -E '^fork-([0-9]+|latest)$' | grep -v "^$TAG\$" \
            | xargs -r -n1 gh release delete --repo "${{ github.repository }}" --yes --cleanup-tag
      - name: File an issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          MARKER="[fork-rebase-failure]"
          EXISTING=$(gh issue list --repo "${{ github.repository }}" --search "$MARKER in:title is:open" --json number -q '.[0].number')
          if [ -z "$EXISTING" ]; then
            BODY=$'Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\nTrigger: ${{ github.event_name }}\nNeeds review at the next weekly Claude session (or sooner if urgent).'
            gh issue create --repo "${{ github.repository }}" \
              --title "$MARKER Rebase/build failed on $(date -u +%Y-%m-%d)" \
              --body "$BODY"
          else
            echo "Open failure issue #$EXISTING already exists, not creating a duplicate."
          fi
